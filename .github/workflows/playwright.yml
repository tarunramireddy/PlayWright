name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
        environment: [dev, staging]
        # Exclude combinations to reduce matrix size if needed
        exclude:
          - browser: webkit
            environment: dev

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Setup environment variables
      run: |
        echo "ENV=${{ matrix.environment }}" >> $GITHUB_ENV
        echo "BROWSER=${{ matrix.browser }}" >> $GITHUB_ENV
        
    - name: Create environment file
      run: |
        cp .env.example .env
        echo "ENV=${{ matrix.environment }}" >> .env
        echo "CI=true" >> .env

    - name: Run Playwright tests
      run: |
        if [ "${{ github.event.inputs.browser }}" = "all" ] || [ -z "${{ github.event.inputs.browser }}" ]; then
          npm run test:env:${{ matrix.environment }}
        else
          npm run test:env:${{ matrix.environment }} -- --project=${{ github.event.inputs.browser || matrix.browser }}
        fi
      env:
        ENV: ${{ matrix.environment }}
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-results-${{ matrix.browser }}-${{ matrix.environment }}
        path: |
          test-results/
          playwright-report/
          allure-results/
        retention-days: 30

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.browser }}-${{ matrix.environment }}
        path: playwright-report/
        retention-days: 30

  allure-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Combine Allure results
      run: |
        mkdir -p allure-results
        find artifacts -name "allure-results" -type d -exec cp -r {}/* allure-results/ \;
      
    - name: Generate Allure report
      if: always()
      run: |
        npm install -g allure-commandline
        allure generate allure-results -o allure-report --clean
        
    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
        
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-report
        destination_dir: allure-report

  notify:
    runs-on: ubuntu-latest
    needs: [test, allure-report]
    if: always()
    
    steps:
    - name: Notify on Slack
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#qa-automation'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        
    # Email notification example
    - name: Send email notification
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: 'Playwright Tests Failed - ${{ github.repository }}'
        body: |
          The Playwright tests failed on ${{ github.ref }}.
          
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          
          Check the results: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: qa-team@example.com
        from: noreply@example.com